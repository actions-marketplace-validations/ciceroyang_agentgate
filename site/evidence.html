<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>agentgate · 证据索引</title>
<style>
:root{--fg:#111;--muted:#5b6472;--line:#e6e8eb;--bg:#fff;--clean:#2ea043;--find:#d29922;--inc:#8b949e}
@media (prefers-color-scheme: dark){:root{--fg:#e8eaed;--muted:#9aa4b2;--line:#2a2f36;--bg:#0f1115}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
header{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px;position:sticky;top:53px;background:var(--bg)}
tr{cursor:pointer}tr:hover{background:rgba(127,127,127,.06)}
.v{font-weight:600}.clean{color:var(--clean)}.findings{color:var(--find)}.incomplete{color:var(--inc)}
#detail{position:fixed;inset:0 0 0 auto;width:min(620px,92vw);background:var(--bg);border-left:1px solid var(--line);padding:20px;overflow:auto;display:none;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
#detail.open{display:block}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(127,127,127,.08);padding:8px;border-radius:6px;font-size:13px}
.close{float:right;cursor:pointer;color:var(--muted)}
</style></head><body>
<header>
  <h1>agentgate · 证据索引</h1>
  <p class="meta" id="diffmeta"></p>
  <pre id="diff" style="display:none;margin:10px 0"></pre>
  <p class="meta" id="meta"></p>
  <p class="meta" id="counts"></p>
</header>
<div class="bar">
  <input id="q" placeholder="搜索服务器名或包名">
  <select id="v"><option value="">全部判定</option><option>clean</option><option>findings</option><option>incomplete</option></select>
  <span class="meta" id="n"></span>
</div>
<table><thead><tr><th>服务器</th><th>判定</th><th>包</th><th>证据</th></tr></thead><tbody id="rows"></tbody></table>
<div id="detail"><span class="close" onclick="closeD()">关闭 ×</span><div id="body"></div></div>
<script id="data" type="application/json">__DATA__</script>
<script id="diffdata" type="application/json">__DIFFJSON__</script>
<script>
var DATA = JSON.parse(document.getElementById("data").textContent);
var DIFF = JSON.parse(document.getElementById("diffdata").textContent || '""');
var rows = document.getElementById("rows");
var q = document.getElementById("q");
var vf = document.getElementById("v");
var n = document.getElementById("n");
function evCount(r){ var c=0; for (var i=0;i<r.evidence.length;i++) c+=r.evidence[i].findings.length; return c; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(){
  var query = q.value.trim().toLowerCase(), ver = vf.value;
  var out = DATA.filter(function(r){
    if (ver && r.verdict !== ver) return false;
    if (!query) return true;
    if (r.server.toLowerCase().indexOf(query) !== -1) return true;
    return r.packages.some(function(p){ return p.toLowerCase().indexOf(query) !== -1; });
  });
  n.textContent = "显示 " + out.length + " / " + DATA.length;
  var html = out.slice(0,600).map(function(r){
    return "<tr onclick=\"openD(" + DATA.indexOf(r) + ")\"><td>" + esc(r.server) + "</td><td class=\"v " + r.verdict + "\">" + r.verdict + "</td><td class=\"meta\">" + esc(r.packages.join(", ") || "—") + "</td><td class=\"meta\">" + r.evidence.length + " 块 / " + evCount(r) + " 条</td></tr>";
  }).join("");
  if (out.length > 600) html += "<tr><td colspan=4 class=\"meta\">只显示前 600 条,请用搜索缩小范围</td></tr>";
  rows.innerHTML = html;
}
function openD(i){
  var r = DATA[i];
  var h = "<h2>" + esc(r.server) + "</h2><p class=\"v " + r.verdict + "\">" + r.verdict + "</p>";
  if (r.packages.length) h += "<p class=\"meta\">包:" + esc(r.packages.join(", ")) + "</p>";
  for (var i2=0;i2<r.evidence.length;i2++){
    var e = r.evidence[i2];
    h += "<h3>" + e.block + " <span class=\"meta\">[" + e.source + "]</span></h3>";
    h += "<p>" + e.status + (e.reason ? " <span class=\"meta\">(" + esc(e.reason) + ")</span>" : "") + "</p>";
    if (e.findings.length) {
      h += "<pre>" + e.findings.map(function(f){ return f.severity.toUpperCase() + " " + f.rule + (f.file ? "\n" + f.file : "") + "\n" + esc(f.message); }).join("\n\n") + "</pre>";
    }
  }
  document.getElementById("body").innerHTML = h;
  document.getElementById("detail").classList.add("open");
}
function closeD(){ document.getElementById("detail").classList.remove("open"); }
q.oninput = render; vf.onchange = render;
if (DIFF && DIFF.trim()) { document.getElementById("diff").textContent = DIFF; document.getElementById("diff").style.display = "block"; }
document.getElementById("meta").textContent = "生成于 " + window.__GENERATED_AT__ + " · 共 " + DATA.length + " 条";
document.getElementById("counts").innerHTML = window.__COUNTS__ + " — incomplete 表示有东西没查到,那不是通过";
render();
</script></body></html>
