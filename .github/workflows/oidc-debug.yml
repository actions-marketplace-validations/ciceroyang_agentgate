# Temporary diagnostic: mint an npm-audience OIDC token, try the publish-token exchange, and
# report only the status and any error message. It never prints a token, and publishes nothing.
name: oidc-debug
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Exchange probe
        run: |
          echo "node: $(node -v)  npm: $(npm -v)"
          echo "id_token_url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "NPM_ID_TOKEN present: ${NPM_ID_TOKEN:+yes}"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" > /tmp/oidc.json
          node -e "
            const fs = require('fs');
            const body = JSON.parse(fs.readFileSync('/tmp/oidc.json', 'utf8'));
            fs.writeFileSync('/tmp/idtoken.txt', body.value);
            const p = JSON.parse(Buffer.from(body.value.split('.')[1], 'base64url').toString('utf8'));
            console.log('claims: repo=' + p.repository + ' id=' + p.repository_id + ' ref=' + p.ref + ' workflow=' + p.job_workflow_ref + ' event=' + p.event_name);
          "
          code=$(curl -sS -o /tmp/exchange.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $(cat /tmp/idtoken.txt)" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@zhiliangtech%2fagentgate")
          echo "exchange http status: $code"
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/exchange.json', 'utf8'));
            console.log('response has token: ' + (typeof r.token === 'string'));
            if (typeof r.token !== 'string') console.log('error body: ' + JSON.stringify(r).slice(0, 800));
          "
